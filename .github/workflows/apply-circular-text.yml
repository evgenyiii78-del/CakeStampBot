name: Apply circular text v1.7.0
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-circular-text.yml'
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Patch bot and stamp engine
        shell: python
        run: |
          from pathlib import Path
          p = Path('bot.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace('CakeStampBot v1.6.7', 'CakeStampBot v1.7.0')
          anchor = '''def heart_keyboard() -> InlineKeyboardMarkup:\n'''
          circular_ui = '''def circular_text_keyboard() -> InlineKeyboardMarkup:\n    return InlineKeyboardMarkup(\n        [\n            [InlineKeyboardButton("➡️ Обычный", callback_data="text_arc:normal")],\n            [InlineKeyboardButton("⬆️ Дугой сверху", callback_data="text_arc:top")],\n            [InlineKeyboardButton("⬇️ Дугой снизу", callback_data="text_arc:bottom")],\n            [InlineKeyboardButton("⭕ По всей окружности", callback_data="text_arc:circle")],\n        ]\n    )\n\n\n'''
          if 'def circular_text_keyboard()' not in s:
              s = s.replace(anchor, circular_ui + anchor)
          s = s.replace('f"• шрифт: {stamp_font_name(context)}\\n"', 'f"• шрифт: {stamp_font_name(context)}\\n"\n        f"• текст: {dict(normal=\'обычный\', top=\'дугой сверху\', bottom=\'дугой снизу\', circle=\'по окружности\').get(context.user_data.get(\'text_arc\', \'normal\'), \'обычный\')}\\n"')
          old = '''            else:\n                context.user_data["base_size"] = context.user_data.get("stamp_size", "105")\n                context.user_data["line_width"] = 0.25\n                await query.edit_message_text("Добавить сердечко?", reply_markup=heart_keyboard())\n            return\n'''
          new = '''            else:\n                context.user_data["base_size"] = context.user_data.get("stamp_size", "105")\n                context.user_data["line_width"] = 0.25\n                if context.user_data.get("source") == "text":\n                    await query.edit_message_text("Как расположить текст?", reply_markup=circular_text_keyboard())\n                else:\n                    context.user_data["text_arc"] = "normal"\n                    await query.edit_message_text("Добавить сердечко?", reply_markup=heart_keyboard())\n            return\n'''
          if old not in s: raise SystemExit('bot round flow anchor not found')
          s = s.replace(old, new, 1)
          old = '''        if data.startswith("rect_size:"):\n            context.user_data["base_size"] = data.split(":", 1)[1]\n            context.user_data["line_width"] = 0.25\n            await query.edit_message_text("Добавить сердечко?", reply_markup=heart_keyboard())\n            return\n'''
          new = '''        if data.startswith("rect_size:"):\n            context.user_data["base_size"] = data.split(":", 1)[1]\n            context.user_data["line_width"] = 0.25\n            context.user_data["text_arc"] = "normal"\n            await query.edit_message_text("Добавить сердечко?", reply_markup=heart_keyboard())\n            return\n\n        if data.startswith("text_arc:"):\n            arc = data.split(":", 1)[1]\n            if arc not in {"normal", "top", "bottom", "circle"}: arc = "normal"\n            context.user_data["text_arc"] = arc\n            await query.edit_message_text("Добавить сердечко?", reply_markup=heart_keyboard())\n            return\n'''
          if old not in s: raise SystemExit('bot rect flow anchor not found')
          s = s.replace(old, new, 1)
          old = '''        layout_mode=params.get("layout_mode", "assembled"),\n    )\n\n\nasync def cake_worker'''
          new = '''        layout_mode=params.get("layout_mode", "assembled"),\n        text_arc=params.get("text_arc", "normal"),\n    )\n\n\nasync def cake_worker'''
          if old not in s: raise SystemExit('bot text build anchor not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          p = Path('engine/stamp_engine.py')
          s = p.read_text(encoding='utf-8')
          anchor = '''def build_stamp_from_text(\n'''
          helper = r'''def _bend_text_on_circle(shape, base_size, mode):
    """Bend final stamp text geometry onto a circular path. STAMP text only."""
    mode = str(mode or "normal").lower()
    if mode == "normal" or shape is None or shape.is_empty:
        return shape
    nominal, _, _ = parse_size(base_size, "round")
    minx, miny, maxx, maxy = shape.bounds
    width = max(maxx - minx, 1e-6)
    cy = (miny + maxy) / 2.0
    radius = float(nominal) * 0.37
    span = math.radians(155.0 if mode in {"top", "bottom"} else 320.0)
    def bend_xy(x, y):
        xn = (float(x) - (minx + maxx) / 2.0) / width
        theta = xn * span
        local_y = float(y) - cy
        if mode == "bottom":
            theta = -theta
            r = radius - local_y
            return r * math.sin(theta), -r * math.cos(theta)
        r = radius + local_y
        return r * math.sin(theta), r * math.cos(theta)
    def map_ring(coords):
        return [bend_xy(x, y) for x, y in coords]
    from shapely.geometry import Polygon
    polys = [shape] if shape.geom_type == "Polygon" else list(shape.geoms) if shape.geom_type == "MultiPolygon" else []
    out = []
    for poly in polys:
        q = Polygon(map_ring(poly.exterior.coords), [map_ring(r.coords) for r in poly.interiors]).buffer(0)
        if not q.is_empty:
            if q.geom_type == "Polygon": out.append(q)
            elif q.geom_type == "MultiPolygon": out.extend(q.geoms)
    return unary_union(out).buffer(0) if out else shape


'''
          if '_bend_text_on_circle' not in s: s = s.replace(anchor, helper + anchor, 1)
          idx = s.find('def build_stamp_from_text(')
          tail = s[idx:]
          old = '''    add_heart=False,\n    layout_mode="assembled",\n):\n'''
          new = '''    add_heart=False,\n    layout_mode="assembled",\n    text_arc="normal",\n):\n'''
          if old not in tail: raise SystemExit('engine signature anchor not found')
          tail = tail.replace(old, new, 1); s = s[:idx] + tail
          anchor = '''    safe_name = _safe_text_filename(text)\n'''
          insert = '''    if base_shape == "round" and str(text_arc or "normal") != "normal":\n        relief_shape = _bend_text_on_circle(relief_shape, base_size, text_arc)\n\n'''
          idx = s.find('def build_stamp_from_text('); pos = s.find(anchor, idx)
          if pos < 0: raise SystemExit('engine safe_name anchor not found')
          s = s[:pos] + insert + s[pos:]
          old = '''            "stroke_width_mode": "exact_centerline_buffer",\n            "px_per_mm": PX_TEXT,\n'''
          new = '''            "stroke_width_mode": "exact_centerline_buffer",\n            "text_arc": str(text_arc or "normal"),\n            "px_per_mm": PX_TEXT,\n'''
          idx = s.find('def build_stamp_from_text('); tail = s[idx:]
          if old not in tail: raise SystemExit('engine metadata anchor not found')
          tail = tail.replace(old, new, 1); s = s[:idx] + tail
          p.write_text(s, encoding='utf-8')
          import py_compile
          py_compile.compile('bot.py', doraise=True)
          py_compile.compile('engine/stamp_engine.py', doraise=True)
      - name: Commit v1.7.0
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot.py engine/stamp_engine.py
          git commit -m "Add circular stamp text v1.7.0" || exit 0
          git push
